[package]
name = "course-snatching-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# 独立于主包的 workspace：fuzz 目标只在手动运行 cargo-fuzz 时构建，
# 不该拖慢也不该污染日常的 cargo build / test。
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.course-snatching]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_body"
path = "fuzz_targets/decode_body.rs"
test = false
doc = false
bench = false
