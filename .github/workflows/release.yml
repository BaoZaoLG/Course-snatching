name: Release

on:
  push:
    tags:
      - "v*"

# 默认只读；写权限与 attestation 权限只给需要的 job。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # 增量编译对一次性的发布构建毫无意义，还会引入额外的中间状态。
  CARGO_INCREMENTAL: "0"
  # 去掉产物里的本机路径，向可复现构建靠拢。
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}="

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      # provenance attestation 需要这两项。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb2c1c2f695925bacf07f0 # 1.97.1
        with:
          components: rustfmt, clippy
      # 发布构建不复用缓存：rust-cache 是可变的、跨 workflow 共享的，一个被
      # 污染的缓存能直接进入用户下载的二进制，也让「可复现构建」无从谈起。
      - uses: taiki-e/install-action@d125c0a83576d3c0c86ac610c708b38d3565af4e # v2
        with:
          tool: cargo-deny
      - name: Release preflight
        shell: pwsh
        run: .\scripts\release-preflight.ps1 -Tag "${{ github.ref_name }}"
      - name: Quality gate
        shell: pwsh
        run: .\scripts\quality-gate.ps1
      - name: Package
        shell: pwsh
        run: |
          $env:COURSE_SNATCHING_SKIP_QUALITY_GATE = "1"
          .\scripts\package.ps1
          $zip = Get-ChildItem dist\*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "no zip produced" }
          "ZIP_PATH=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$($zip.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
      # .sha256 只能检测传输损坏，防不了发布流水线本身被污染。
      # provenance 才是「这个 zip 确实由这个仓库的这次提交构建出来」的证据。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: "dist/*.zip"
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.2.0
        with:
          subject-path: "dist/*.zip"
          sbom-path: "dist/sbom.cdx.json"
      - name: Upload release assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/sbom.cdx.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
