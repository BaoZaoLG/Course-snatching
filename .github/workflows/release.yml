name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Release preflight
        shell: pwsh
        run: .\scripts\release-preflight.ps1 -Tag "${{ github.ref_name }}"
      - name: Install security audit tool
        run: cargo install cargo-audit --locked
      - name: Quality gate
        shell: pwsh
        run: .\scripts\quality-gate.ps1
      - name: Package
        shell: pwsh
        run: |
          $env:COURSE_SNATCHING_SKIP_QUALITY_GATE = "1"
          .\scripts\package.ps1
          $zip = Get-ChildItem dist\*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "no zip produced" }
          "ZIP_PATH=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$($zip.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
