name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - name: Security audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          .\scripts\audit.ps1
      - run: cargo build --release
      - name: Verify package contents
        shell: pwsh
        run: |
          $files = cargo package --list --allow-dirty
          $forbidden = @('config.toml', 'Course-snatching.exe', 'src.rar', 'runtime\debug')
          foreach ($item in $forbidden) {
            if ($files | Select-String -SimpleMatch $item) {
              throw "Forbidden package content: $item"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Course-snatching-windows-x64
          path: |
            target/release/Course-snatching.exe
            README.md
            LICENSE
            CHANGELOG.md
            SECURITY.md
            config.example.toml
          if-no-files-found: error

