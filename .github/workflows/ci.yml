name: CI

on:
  push:
    # 同仓库 PR 会同时触发 push 与 pull_request，等于把每次 CI 跑两遍。
    branches: [main]
  pull_request:

# 默认最小权限。
permissions:
  contents: read

# 同一分支的新推送取消旧运行，别让排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Action 一律固定到 commit SHA：可变 tag 可以被重新指向，是 Actions
      # 供应链攻击的标准入口。版本注释供 dependabot 维护。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb2c1c2f695925bacf07f0 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      # 预编译分发，别每次从源码编译（cargo install 要 2–4 分钟）。
      - uses: taiki-e/install-action@d125c0a83576d3c0c86ac610c708b38d3565af4e # v2
        with:
          tool: cargo-deny
      - name: Quality gate
        shell: pwsh
        run: .\scripts\quality-gate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Course-snatching-windows-x64
          path: |
            target/release/Course-snatching.exe
            README.md
            LICENSE
            CHANGELOG.md
            SECURITY.md
            config.example.toml
          if-no-files-found: error

  # 代码里已经写了 #[cfg(not(windows))] 分支（config.rs、single_instance.rs、
  # notify.rs）。几行 YAML 就能保住它们不腐化。
  cross-platform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb2c1c2f695925bacf07f0 # 1.97.1
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: Check non-Windows branches still compile
        run: cargo check --locked --all-targets

  # MSRV 独立成 job：Cargo.toml 的 rust-version 与 rust-toolchain.toml 同版本
  # 时，MSRV 这个概念其实并不存在——只有真的用那个版本编一次才知道它成不成立。
  msrv:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $msrv = $meta.packages[0].rust_version
          if (-not $msrv) { throw "Cargo.toml 缺少 rust-version" }
          "version=$msrv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb2c1c2f695925bacf07f0 # pinned
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      - run: cargo check --locked --all-targets
