[package]
name = "course-monitor"
version = "0.10.1"
edition = "2021"
rust-version = "1.97.1"
description = "教务选课监控 GUI：程序内登录 + 接口选课（无浏览器）"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/course-monitor"
keywords = ["egui", "course", "monitor"]
categories = ["gui"]
include = [
    "/src/**",
    "/assets/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/config.example.toml",
    "/rust-toolchain.toml",
    "/scripts/**",
]

[dependencies]
anyhow = "1"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "form", "rustls", "gzip", "stream"] }
rfd = "0.17"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "1.1"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
strip = true
opt-level = 3
lto = "thin"

