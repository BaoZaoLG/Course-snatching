[package]
name = "course-snatching"
version = "0.10.2"
edition = "2021"
rust-version = "1.97.1"
description = "教务选课监控桌面工具：程序内登录、余量监控与选课提交"
license = "MIT"
readme = "README.md"
repository = "https://github.com/BaoZaoLG/Course-snatching"
keywords = ["egui", "course", "elect"]
categories = ["gui"]
include = [
    "/src/**",
    "/assets/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/config.example.toml",
    "/rust-toolchain.toml",
    "/scripts/**",
]

[[bin]]
name = "Course-snatching"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "form", "rustls", "gzip", "stream"] }
rfd = "0.17"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
# strip = true 会把符号全剥掉，panic hook 里的 Backtrace::force_capture()
# 只剩裸地址——排障价值接近零，却仍然暴露模块布局。只剥调试信息，保留
# 函数符号，崩溃报告才是可读的。
strip = "debuginfo"
opt-level = 3
lto = "thin"
